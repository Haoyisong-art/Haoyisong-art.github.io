<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Spiritual Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height - adjusts with browser UI */
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            font-family: 'Georgia', serif;
            background: #000;
            color: white;
            touch-action: pan-x pan-y;
        }

        /* Cosmos canvas backdrop */
        #cosmosCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport - adapts to browser UI */
            z-index: 1;
        }

        /* Particle canvas overlay */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport - adapts to browser UI */
            z-index: 3;
            pointer-events: none;
        }

        /* Top-left badge */
        .animism-badge {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            color: white;
            letter-spacing: 0.5px;
        }

        /* Prayer overlay - center content */
        .prayer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 4;
            padding: 2rem;
            pointer-events: none;
        }

        .prayer-overlay > * {
            pointer-events: auto;
        }

        .prayer-text {
            max-width: 700px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .prayer-text.visible {
            opacity: 1;
        }

        .prayer-text p {
            color: #ffffff;
            line-height: 2;
            font-size: 1.3rem;
            font-style: italic;
            text-shadow: 0 3px 8px rgba(0,0,0,0.9);
        }

        /* Additional input */
        .additional-input {
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .additional-input.visible {
            opacity: 1;
        }

        .additional-input input {
            padding: 0.6rem 1.2rem;
            width: 300px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
            text-align: center;
        }

        .additional-input input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Bottom prayer bar */
        .prayer-bar {
            position: fixed;
            bottom: calc(clamp(80px, 12vh, 120px) + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 0.8rem;
            transition: opacity 0.3s ease;
        }

        .prayer-bar.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .prayer-button {
            background: transparent;
            color: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 400;
            font-family: 'Georgia', serif;
            letter-spacing: 0.3px;
        }

        .prayer-button:hover {
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Element selector - below input */
        .element-selector {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .element-selector.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .element-selector-title {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.7);
            margin-right: 0.5rem;
            text-align: center;
            line-height: 1.3;
        }

        .element-emoji {
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.2rem;
            opacity: 0.8;
        }

        .element-emoji:hover {
            transform: scale(1.2);
            opacity: 1;
        }

        /* Collaboration credit */
        .collaboration-credit {
            position: fixed;
            bottom: calc(clamp(30px, 5vh, 50px) + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            line-height: 1.4;
            white-space: nowrap;
        }

        /* Music control button */
        .music-control-button {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10;
            background: transparent;
            color: white;
            border: none;
            padding: 0.3rem 0.5rem;
            font-size: 1.2rem;
            border-radius: 0;
            cursor: pointer;
            backdrop-filter: none;
            transition: all 0.3s;
        }

        .music-control-button:hover {
            opacity: 0.7;
        }

        /* Back to home button */
        .back-home-button {
            position: fixed;
            top: 1rem;
            right: 3.5rem;
            z-index: 10;
            background: transparent;
            color: white;
            border: none;
            padding: 0.3rem 0.5rem;
            font-size: 0.7rem;
            border-radius: 0;
            cursor: pointer;
            backdrop-filter: none;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .back-home-button:hover {
            opacity: 0.7;
        }

        /* Pray again button */
        .pray-again-button {
            position: fixed;
            bottom: calc(clamp(90px, 12vh, 140px) + env(safe-area-inset-bottom, 0px));
            right: 2rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
        }

        .pray-again-button.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .pray-again-button:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .prayer-overlay {
                padding: 1rem;
                padding-top: 15vh; /* Ensure content starts higher on screen */
                max-height: 100vh;
                overflow-y: auto;
            }

            .prayer-text {
                max-width: 90%;
                padding: 1rem;
                margin-bottom: 1rem;
            }

            .prayer-text p {
                font-size: 0.95rem;
                line-height: 1.6;
            }

            .additional-input {
                margin-top: 0.8rem;
            }

            .additional-input input {
                width: 90%;
                max-width: 280px;
                font-size: 0.85rem;
                padding: 0.5rem 1rem;
            }

            .element-selector {
                flex-wrap: nowrap;
                gap: 0.4rem;
                margin-top: 0.8rem;
                max-width: 100%;
            }

            .element-selector-title {
                font-size: 0.6rem;
                margin-right: 0.3rem;
            }

            .element-emoji {
                font-size: 1.1rem;
                padding: 0.15rem;
            }

            .prayer-bar {
                /* Prayer bar must be ABOVE collaboration credit - increased significantly */
                bottom: calc(clamp(200px, 26vh, 260px) + env(safe-area-inset-bottom, 0px));
                flex-wrap: nowrap;
                justify-content: center;
                gap: 0.3rem;
            }

            .prayer-button {
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
            }

            .animism-badge {
                top: 1rem;
                left: 1rem;
                font-size: 0.8rem;
                padding: 0.5rem 1rem;
            }

            .collaboration-credit {
                font-size: 0.6rem;
                /* DOUBLED - Much more aggressive vertical spacing */
                bottom: calc(clamp(140px, 18vh, 180px) + env(safe-area-inset-bottom, 0px));
                line-height: 1.2;
            }

            /* Pray again button on mobile - aligned with prayer bar */
            .pray-again-button {
                /* Same height as prayer bar for consistent positioning */
                bottom: calc(clamp(200px, 26vh, 260px) + env(safe-area-inset-bottom, 0px));
                right: 1.5rem;
            }
        }

        /* Extra small devices - specific fixes for very small screens */
        @media (max-width: 430px) {
            .prayer-overlay {
                padding-top: 12vh;
            }

            .prayer-text p {
                font-size: 0.85rem;
                line-height: 1.5;
            }

            .element-selector {
                gap: 0.3rem;
            }

            .element-emoji {
                font-size: 1rem;
            }

            .element-selector-title {
                font-size: 0.55rem;
            }
        }

        /* Landscape orientation on mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .prayer-overlay {
                padding-top: 8vh;
                padding-bottom: 25vh;
            }

            .prayer-text {
                max-width: 80%;
                padding: 0.5rem;
                margin-bottom: 0.5rem;
            }

            .prayer-text p {
                font-size: 0.75rem;
                line-height: 1.4;
            }

            .additional-input {
                margin-top: 0.5rem;
            }

            .additional-input input {
                width: 80%;
                max-width: 250px;
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
            }

            .element-selector {
                gap: 0.3rem;
                margin-top: 0.5rem;
            }

            .element-emoji {
                font-size: 0.9rem;
            }

            .element-selector-title {
                font-size: 0.5rem;
            }

            .prayer-bar {
                /* Match portrait mobile - prayer bar above credit */
                bottom: calc(clamp(200px, 26vh, 260px) + env(safe-area-inset-bottom, 0px));
                gap: 0.25rem;
            }

            .prayer-button {
                padding: 0.3rem 0.5rem;
                font-size: 0.65rem;
            }

            .collaboration-credit {
                /* Match portrait mobile - doubled spacing */
                bottom: calc(clamp(140px, 18vh, 180px) + env(safe-area-inset-bottom, 0px));
                font-size: 0.5rem;
                line-height: 1.1;
            }

            .pray-again-button {
                /* Match portrait mobile - same level as prayer bar */
                bottom: calc(clamp(200px, 26vh, 260px) + env(safe-area-inset-bottom, 0px));
                right: 1rem;
                padding: 0.4rem 0.8rem;
                font-size: 0.7rem;
            }

            .animism-badge {
                top: 0.5rem;
                left: 0.5rem;
                font-size: 0.65rem;
                padding: 0.3rem 0.6rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animism badge -->
    <div class="animism-badge">Animism · 万物灵</div>

    <!-- Back to Home button -->
    <button class="back-home-button" onclick="goBackHome()">Back to Home</button>

    <!-- Music control button -->
    <button class="music-control-button" id="musicControl" onclick="toggleMusic()">🔊</button>

    <!-- Cosmos canvas -->
    <canvas id="cosmosCanvas"></canvas>

    <!-- Particle canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Prayer overlay -->
    <div class="prayer-overlay">
        <div class="prayer-text" id="prayerText">
            <p></p>
        </div>
        <div class="additional-input" id="additionalInput">
            <input type="text" id="additionalPrayer" placeholder="Add your own words...">
        </div>

        <!-- Element selector - below input -->
        <div class="element-selector" id="elementSelector">
            <div class="element-selector-title">Send with · 传送</div>
            <div class="element-emoji" data-element="metal" title="Metal · 金">💰</div>
            <div class="element-emoji" data-element="wood" title="Wood · 木">🌳</div>
            <div class="element-emoji" data-element="water" title="Water · 水">💧</div>
            <div class="element-emoji" data-element="fire" title="Fire · 火">🔥</div>
            <div class="element-emoji" data-element="earth" title="Earth · 土">⛰️</div>
        </div>
    </div>

    <!-- Bottom prayer bar -->
    <div class="prayer-bar" id="prayerBar">
        <button class="prayer-button" onclick="generatePrayer('zh', 'pray')">祈福</button>
        <button class="prayer-button" onclick="generatePrayer('zh', 'relief')">消灾</button>
        <button class="prayer-button" onclick="generatePrayer('en', 'pray')">Pray</button>
        <button class="prayer-button" onclick="generatePrayer('en', 'relief')">Relief</button>
    </div>

    <!-- Pray again button -->
    <button class="pray-again-button" id="prayAgainButton" onclick="restartPrayer()">Pray Again</button>

    <!-- Collaboration credit -->
    <div class="collaboration-credit">
        Tech support by Dr. Yilan Liu<br>
        Co-created with Claude · 与Claude共同创作
    </div>

    <!-- Background audio -->
    <audio id="backgroundAudio" loop>
        <source src="audio/relaxing-birds-and-piano-music-137153.mp3" type="audio/mpeg">
    </audio>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ============================================
        // THREE.JS COSMOS SETUP
        // ============================================
        let scene, camera, renderer, stars, comet;
        let cometActive = false;

        function initThreeJS() {
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            // Renderer
            const canvas = document.getElementById('cosmosCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio); // High DPI

            // Starfield
            createStarfield();

            // Animation loop
            animateCosmos();

            // Resize handler
            window.addEventListener('resize', onWindowResize);
        }

        function createStarfield() {
            // Create multiple star layers with varying sizes for realistic effect
            const starGroup = new THREE.Group();

            // Main stars - small circles (most realistic)
            const mainStarGeometry = new THREE.BufferGeometry();
            const mainStarCount = 4000; // Increased from 2500
            const mainPositions = new Float32Array(mainStarCount * 3);
            const mainSizes = new Float32Array(mainStarCount);
            const mainOpacities = new Float32Array(mainStarCount);

            for (let i = 0; i < mainStarCount; i++) {
                const i3 = i * 3;
                mainPositions[i3] = (Math.random() - 0.5) * 100;     // x
                mainPositions[i3 + 1] = (Math.random() - 0.5) * 100; // y
                mainPositions[i3 + 2] = (Math.random() - 0.5) * 100; // z

                // Varying sizes for depth
                mainSizes[i] = Math.random() * 0.2 + 0.08; // Larger stars
                // Higher opacity - brighter stars
                mainOpacities[i] = Math.random() * 0.3 + 0.7; // 0.7-1.0 instead of 0.6-1.0
            }

            mainStarGeometry.setAttribute('position', new THREE.BufferAttribute(mainPositions, 3));
            mainStarGeometry.setAttribute('size', new THREE.BufferAttribute(mainSizes, 1));
            mainStarGeometry.setAttribute('opacity', new THREE.BufferAttribute(mainOpacities, 1));

            // Create circular star texture
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.3)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            const starTexture = new THREE.CanvasTexture(canvas);

            const mainStarMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.15, // Larger base size
                transparent: true,
                opacity: 1.0, // Full opacity
                sizeAttenuation: true,
                vertexColors: false,
                map: starTexture,
                blending: THREE.AdditiveBlending
            });

            const mainStars = new THREE.Points(mainStarGeometry, mainStarMaterial);
            starGroup.add(mainStars);

            // Milky Way - Silver River effect
            const milkyWayGeometry = new THREE.BufferGeometry();
            const milkyWayCount = 12000; // Even more stars
            const milkyWayPositions = new Float32Array(milkyWayCount * 3);
            const milkyWayColors = new Float32Array(milkyWayCount * 3);
            const milkyWaySizes = new Float32Array(milkyWayCount);

            let actualCount = 0;
            for (let i = 0; i < milkyWayCount; i++) {
                const i3 = actualCount * 3;

                // Create a diagonal band across the sky (Milky Way path)
                const bandWidth = 30; // Even wider band
                const bandAngle = Math.PI / 6; // Shallower angle (30 degrees)

                // Position along the band
                const alongBand = (Math.random() - 0.5) * 140;
                const acrossBand = (Math.random() - 0.5) * bandWidth;

                // Create diagonal distribution with Gaussian-like density (denser in center)
                const density = Math.exp(-Math.pow(acrossBand / (bandWidth * 0.4), 2));

                if (Math.random() > density * 1.2) continue; // Accept more stars

                milkyWayPositions[i3] = alongBand * Math.cos(bandAngle) - acrossBand * Math.sin(bandAngle);
                milkyWayPositions[i3 + 1] = alongBand * Math.sin(bandAngle) + acrossBand * Math.cos(bandAngle);
                milkyWayPositions[i3 + 2] = (Math.random() - 0.5) * 60;

                // Color variation - mix of white, blue-white, and slight yellow tints
                const colorVariation = Math.random();
                if (colorVariation < 0.6) {
                    // Silvery white
                    milkyWayColors[i3] = 1.0;
                    milkyWayColors[i3 + 1] = 1.0;
                    milkyWayColors[i3 + 2] = 1.0;
                } else if (colorVariation < 0.85) {
                    // Slight blue tint
                    milkyWayColors[i3] = 0.85;
                    milkyWayColors[i3 + 1] = 0.9;
                    milkyWayColors[i3 + 2] = 1.0;
                } else {
                    // Warm white with yellow tint
                    milkyWayColors[i3] = 1.0;
                    milkyWayColors[i3 + 1] = 0.98;
                    milkyWayColors[i3 + 2] = 0.9;
                }

                // Varying star sizes for the Milky Way - larger and more visible
                milkyWaySizes[actualCount] = Math.random() * 0.25 + 0.1;
                actualCount++;
            }

            // Trim arrays to actual count
            const trimmedPositions = new Float32Array(actualCount * 3);
            const trimmedColors = new Float32Array(actualCount * 3);
            const trimmedSizes = new Float32Array(actualCount);
            for (let i = 0; i < actualCount * 3; i++) {
                trimmedPositions[i] = milkyWayPositions[i];
                trimmedColors[i] = milkyWayColors[i];
            }
            for (let i = 0; i < actualCount; i++) {
                trimmedSizes[i] = milkyWaySizes[i];
            }

            milkyWayGeometry.setAttribute('position', new THREE.BufferAttribute(trimmedPositions, 3));
            milkyWayGeometry.setAttribute('color', new THREE.BufferAttribute(trimmedColors, 3));
            milkyWayGeometry.setAttribute('size', new THREE.BufferAttribute(trimmedSizes, 1));

            const milkyWayMaterial = new THREE.PointsMaterial({
                size: 0.2, // Larger size
                transparent: true,
                opacity: 1.0, // Full opacity for maximum brightness
                vertexColors: true,
                sizeAttenuation: true,
                blending: THREE.AdditiveBlending,
                map: starTexture // Use same circular texture
            });

            const milkyWay = new THREE.Points(milkyWayGeometry, milkyWayMaterial);
            starGroup.add(milkyWay);

            // Bright stars - create 4-pointed and 8-pointed star sprites
            const brightStarCount = 250; // More bright stars
            for (let i = 0; i < brightStarCount; i++) {
                const x = (Math.random() - 0.5) * 100;
                const y = (Math.random() - 0.5) * 100;
                const z = (Math.random() - 0.5) * 100;

                // Decide between 4-pointed and 8-pointed
                const points = Math.random() > 0.5 ? 4 : 8;
                const size = Math.random() * 0.3 + 0.2;

                // Create star shape
                const starShape = createStarShape(points, size);
                const starGeometry = new THREE.ShapeGeometry(starShape);
                const starMaterial = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: Math.random() * 0.2 + 0.8, // Brighter (0.8-1.0)
                    side: THREE.DoubleSide
                });

                const brightStar = new THREE.Mesh(starGeometry, starMaterial);
                brightStar.position.set(x, y, z);

                // Random rotation for variety
                brightStar.rotation.z = Math.random() * Math.PI * 2;

                starGroup.add(brightStar);
            }

            stars = starGroup;
            scene.add(stars);
        }

        // Helper function to create multi-pointed star shapes
        function createStarShape(points, size) {
            const shape = new THREE.Shape();
            const outerRadius = size;
            const innerRadius = size * 0.15; // Thin rays for realistic diffraction

            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i / (points * 2)) * Math.PI * 2;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;

                if (i === 0) {
                    shape.moveTo(x, y);
                } else {
                    shape.lineTo(x, y);
                }
            }
            shape.closePath();
            return shape;
        }

        function launchComet() {
            if (cometActive) return;

            // Remove old comet if exists
            if (comet) {
                scene.remove(comet);
            }

            // Create star shape for comet head (4 times smaller)
            const starShape = new THREE.Shape();
            const outerRadius = 0.0375;  // 0.15 / 4
            const innerRadius = 0.015;   // 0.06 / 4
            const points = 5;

            for (let i = 0; i < points * 2; i++) {
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i / (points * 2)) * Math.PI * 2;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) {
                    starShape.moveTo(x, y);
                } else {
                    starShape.lineTo(x, y);
                }
            }
            starShape.closePath();

            const headGeometry = new THREE.ShapeGeometry(starShape);
            const headMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 1,
                side: THREE.DoubleSide
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);

            // Add subtle glow around star (4 times smaller)
            const glowGeometry = new THREE.SphereGeometry(0.05, 16, 16);  // 0.2 / 4
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.25
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            head.add(glow);

            // Create line trail with gradient fade
            const trailPoints = [];
            const trailLength = 50;
            for (let i = 0; i < trailLength; i++) {
                trailPoints.push(new THREE.Vector3(0, 0, 0));
            }

            const trailGeometry = new THREE.BufferGeometry().setFromPoints(trailPoints);
            const trailMaterial = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.8,
                linewidth: 2
            });
            const trail = new THREE.Line(trailGeometry, trailMaterial);

            // Starting position (from left-bottom)
            const startX = -12;
            const startY = -8;
            head.position.set(startX, startY, 2);

            // Store comet data
            comet = {
                head: head,
                trail: trail,
                trailPoints: trailPoints,
                time: 0,
                startX: startX,
                startY: startY,
                positions: []
            };

            scene.add(head);
            scene.add(trail);
            cometActive = true;

            // Animate comet
            animateComet();
        }

        function animateComet() {
            if (!comet || !cometActive) return;

            // Increment time for curved path
            comet.time += 0.025;
            const t = comet.time;

            // Curved trajectory using parametric equations
            const speed = 0.25;
            const newX = comet.startX + t * speed * 8;
            const newY = comet.startY + t * speed * 6 + Math.sin(t * 0.8) * 1.5;
            const newZ = 2 + Math.cos(t * 0.5) * 0.5;

            // Update head position
            comet.head.position.set(newX, newY, newZ);

            // Store position history
            comet.positions.unshift(new THREE.Vector3(newX, newY, newZ));
            if (comet.positions.length > 50) {
                comet.positions.pop();
            }

            // Update trail positions with fading effect
            const trailPositions = comet.trail.geometry.attributes.position;
            for (let i = 0; i < comet.positions.length; i++) {
                if (comet.positions[i]) {
                    trailPositions.setXYZ(
                        i,
                        comet.positions[i].x,
                        comet.positions[i].y,
                        comet.positions[i].z
                    );
                }
            }
            trailPositions.needsUpdate = true;

            // Fade trail opacity based on position in trail
            const colors = new Float32Array(50 * 3);
            for (let i = 0; i < 50; i++) {
                const fade = 1 - (i / 50);
                colors[i * 3] = fade;     // r
                colors[i * 3 + 1] = fade; // g
                colors[i * 3 + 2] = fade; // b
            }
            comet.trail.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            comet.trail.material.vertexColors = true;

            // Fade out as it moves far
            if (newX > 12) {
                comet.head.material.opacity -= 0.015;
                comet.trail.material.opacity -= 0.015;

                if (comet.head.material.opacity <= 0) {
                    scene.remove(comet.head);
                    scene.remove(comet.trail);
                    cometActive = false;
                    return;
                }
            }

            requestAnimationFrame(animateComet);
        }

        function animateCosmos() {
            requestAnimationFrame(animateCosmos);

            // Slowly rotate starfield
            if (stars) {
                stars.rotation.y += 0.0002;
                stars.rotation.x += 0.0001;

                // Add subtle twinkling effect to bright stars
                stars.children.forEach((child, index) => {
                    if (index > 0 && child.material) { // Skip first child (main stars point cloud)
                        const time = Date.now() * 0.001;
                        child.material.opacity = 0.5 + Math.sin(time + index) * 0.2;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Also resize particle canvas
            const particleCanvas = document.getElementById('particleCanvas');
            particleCanvas.width = window.innerWidth * window.devicePixelRatio;
            particleCanvas.height = window.innerHeight * window.devicePixelRatio;
            particleCanvas.style.width = window.innerWidth + 'px';
            particleCanvas.style.height = window.innerHeight + 'px';
            particleCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        // ============================================
        // PARTICLE SYSTEM
        // ============================================
        let particleCanvas, particleCtx, particles = [];
        let currentPrayerMode = 'pray';

        function initParticleCanvas() {
            particleCanvas = document.getElementById('particleCanvas');
            particleCtx = particleCanvas.getContext('2d');

            // High DPI canvas
            particleCanvas.width = window.innerWidth * window.devicePixelRatio;
            particleCanvas.height = window.innerHeight * window.devicePixelRatio;
            particleCanvas.style.width = window.innerWidth + 'px';
            particleCanvas.style.height = window.innerHeight + 'px';
            particleCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        class Particle {
            constructor(char, x, y, type) {
                this.char = char;
                this.x = x;
                this.y = y;
                this.type = type;
                this.size = Math.random() * 3 + 2;
                this.opacity = 1;
                this.life = 1;
                this.trail = [];
                this.birthDelay = Math.random() * 120; // 0-2 seconds
                this.showChar = char !== '';
                this.charToParticleProgress = char === '' ? 1 : 0;
                this.age = 0;

                // Initialize movement based on type
                this.initMovement(type);
            }

            initMovement(type) {
                if (type === 'metal') {
                    this.angle = Math.random() * Math.PI * 2;
                    this.spiralRadius = Math.random() * 20;
                    this.spiralSpeed = (Math.random() - 0.5) * 0.1;
                    this.upwardSpeed = Math.random() * 2 + 1;
                    this.shimmer = Math.random() * Math.PI * 2;
                    this.shimmerSpeed = Math.random() * 0.2 + 0.1;
                    this.metalColor = Math.random() > 0.5 ? 'silver' : 'gold';
                } else if (type === 'wood') {
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = -Math.random() * 2.5 - 1.5;
                    this.swirl = Math.random() * Math.PI * 2;
                    this.swirlSpeed = Math.random() * 0.15 + 0.1;
                } else if (type === 'water') {
                    this.vx = (Math.random() - 0.5) * 3;
                    this.vy = Math.random() * 0.5 - 2;
                    this.wave = Math.random() * Math.PI * 2;
                    this.waveSpeed = Math.random() * 0.15 + 0.1;
                } else if (type === 'fire') {
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = -Math.random() * 4 - 2;
                    this.flicker = Math.random() * Math.PI;
                    this.flickerSpeed = Math.random() * 0.3 + 0.2;
                } else if (type === 'earth') {
                    this.vx = (Math.random() - 0.5) * 1;
                    this.vy = -Math.random() * 2 - 1;
                    this.float = Math.random() * Math.PI * 2;
                    this.floatSpeed = Math.random() * 0.08 + 0.05;
                } else if (type === 'shatter') {
                    this.vx = (Math.random() - 0.5) * 8;
                    this.vy = (Math.random() - 0.5) * 8;
                    this.gravity = 0.3;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.3;
                } else if (type === 'wood-break') {
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = Math.random() * 0.5;
                    this.gravity = 0.08;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.08;
                } else if (type === 'flood') {
                    this.vx = (Math.random() - 0.5) * 1;
                    this.vy = Math.random() * 0.6 + 0.3;
                    this.wave = Math.random() * Math.PI * 2;
                    this.waveSpeed = Math.random() * 0.08 + 0.05;
                } else if (type === 'burn') {
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = 0;
                    this.burnStage = 0;
                    this.flicker = Math.random() * Math.PI;
                    this.flickerSpeed = Math.random() * 0.25 + 0.15;
                } else if (type === 'earth-crack') {
                    this.angle = Math.random() * Math.PI * 2;
                    this.speed = Math.random() * 0.8 + 0.3;
                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;
                    this.gravity = 0.05;
                }
            }

            update() {
                // Handle birth delay
                if (this.birthDelay > 0) {
                    this.birthDelay--;
                    return;
                }

                this.age++;

                // Gradual character transformation
                if (this.showChar && this.charToParticleProgress < 1) {
                    this.charToParticleProgress += 0.011;
                }

                // Update position based on type
                this.updatePosition();

                // Slower fade - 5+ seconds minimum
                this.life -= 0.0012; // ~833 frames = ~13.9 seconds at 60fps
                this.opacity = Math.max(0, this.life);
            }

            updatePosition() {
                if (this.type === 'metal') {
                    this.angle += this.spiralSpeed;
                    this.y -= this.upwardSpeed;
                    this.x += Math.cos(this.angle) * this.spiralRadius;
                    this.spiralRadius += 0.3;
                    this.shimmer += this.shimmerSpeed;
                } else if (this.type === 'wood') {
                    this.swirl += this.swirlSpeed;
                    this.x += this.vx + Math.cos(this.swirl) * 3;
                    this.y += this.vy;
                    this.vy -= 0.03;
                } else if (this.type === 'water') {
                    this.wave += this.waveSpeed;
                    this.x += this.vx + Math.sin(this.wave) * 4;
                    this.y += this.vy;
                } else if (this.type === 'fire') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy *= 0.98;
                    this.vx *= 0.95;
                    this.flicker += this.flickerSpeed;
                } else if (this.type === 'earth') {
                    this.float += this.floatSpeed;
                    this.x += this.vx + Math.sin(this.float) * 2;
                    this.y += this.vy;
                    this.vy -= 0.02;
                } else if (this.type === 'shatter') {
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.98;
                    this.rotation += this.rotSpeed;
                } else if (this.type === 'wood-break') {
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.rotSpeed;
                    this.vx *= 0.97;
                } else if (this.type === 'flood') {
                    this.wave += this.waveSpeed;
                    this.x += this.vx;
                    this.y += this.vy;
                } else if (this.type === 'burn') {
                    this.flicker += this.flickerSpeed;
                    this.burnStage += 0.008;
                    if (this.burnStage > 0.5) {
                        this.vy += 0.25;
                        this.x += Math.sin(this.flicker) * 0.5;
                    }
                    this.y += this.vy;
                } else if (this.type === 'earth-crack') {
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.95;
                }

                // Trail for certain types
                if (['fire', 'water', 'metal'].includes(this.type)) {
                    this.trail.push({x: this.x, y: this.y, opacity: this.opacity});
                    if (this.trail.length > 10) this.trail.shift();
                }
            }

            draw() {
                if (this.birthDelay > 0) return;

                particleCtx.save();

                // Draw character if transforming
                if (this.showChar && this.charToParticleProgress < 1) {
                    const charOpacity = (1 - this.charToParticleProgress) * this.opacity;
                    particleCtx.globalAlpha = charOpacity;
                    particleCtx.font = `${24 * (1 - this.charToParticleProgress * 0.5)}px Georgia`;
                    particleCtx.fillStyle = '#ffffff';
                    particleCtx.textAlign = 'center';
                    particleCtx.textBaseline = 'middle';
                    particleCtx.fillText(this.char, this.x, this.y);
                }

                // Draw particle
                const particleOpacity = this.showChar ? this.charToParticleProgress * this.opacity : this.opacity;
                particleCtx.globalAlpha = particleOpacity;

                // Draw trails
                if (this.trail.length > 1) {
                    particleCtx.beginPath();
                    particleCtx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) {
                        particleCtx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                    particleCtx.strokeStyle = this.getColor();
                    particleCtx.lineWidth = this.size * 0.5;
                    particleCtx.stroke();
                }

                particleCtx.translate(this.x, this.y);
                this.drawShape();

                particleCtx.restore();
            }

            drawShape() {
                if (this.type === 'metal') {
                    const shimmerVal = Math.sin(this.shimmer) * 0.5 + 0.5;
                    const color = this.metalColor === 'silver' ?
                        `rgba(${192 + shimmerVal * 63}, ${192 + shimmerVal * 63}, ${192 + shimmerVal * 63}, ${this.opacity})` :
                        `rgba(255, ${215 + shimmerVal * 40}, 0, ${this.opacity})`;
                    particleCtx.beginPath();
                    particleCtx.arc(0, 0, this.size, 0, Math.PI * 2);
                    particleCtx.fillStyle = color;
                    particleCtx.shadowBlur = 20;
                    particleCtx.shadowColor = color;
                    particleCtx.fill();
                } else if (this.type === 'wood') {
                    particleCtx.beginPath();
                    particleCtx.arc(0, 0, this.size, 0, Math.PI * 2);
                    particleCtx.fillStyle = `rgba(34, 139, 34, ${this.opacity})`;
                    particleCtx.shadowBlur = 15;
                    particleCtx.shadowColor = `rgba(50, 205, 50, 0.5)`;
                    particleCtx.fill();
                } else if (this.type === 'water') {
                    particleCtx.beginPath();
                    particleCtx.arc(0, 0, this.size, 0, Math.PI * 2);
                    particleCtx.fillStyle = `rgba(100, 180, 255, ${this.opacity})`;
                    particleCtx.shadowBlur = 10;
                    particleCtx.shadowColor = 'rgba(100, 180, 255, 0.5)';
                    particleCtx.fill();
                } else if (this.type === 'fire') {
                    const intensity = 0.7 + Math.sin(this.flicker) * 0.3;
                    particleCtx.beginPath();
                    particleCtx.arc(0, 0, this.size * (1 + intensity * 0.5), 0, Math.PI * 2);
                    particleCtx.fillStyle = `hsla(${Math.random() * 60}, 100%, ${50 + intensity * 20}%, ${this.opacity})`;
                    particleCtx.shadowBlur = 25;
                    particleCtx.shadowColor = 'rgba(255, 100, 0, 0.8)';
                    particleCtx.fill();
                } else if (this.type === 'earth') {
                    particleCtx.beginPath();
                    particleCtx.arc(0, 0, this.size, 0, Math.PI * 2);
                    particleCtx.fillStyle = `rgba(139, 69, 19, ${this.opacity})`;
                    particleCtx.shadowBlur = 10;
                    particleCtx.fill();
                } else if (this.type === 'shatter' || this.type === 'wood-break' || this.type === 'earth-crack') {
                    particleCtx.beginPath();
                    particleCtx.arc(0, 0, this.size, 0, Math.PI * 2);
                    particleCtx.fillStyle = `rgba(200, 220, 255, ${this.opacity})`;
                    particleCtx.shadowBlur = 8;
                    particleCtx.shadowColor = 'rgba(200, 220, 255, 0.3)';
                    particleCtx.fill();
                } else if (this.type === 'flood') {
                    particleCtx.beginPath();
                    particleCtx.arc(0, 0, this.size * 1.5, 0, Math.PI * 2);
                    particleCtx.fillStyle = `rgba(30, 144, 255, ${this.opacity * 0.6})`;
                    particleCtx.fill();
                } else if (this.type === 'burn') {
                    if (this.burnStage < 0.3) {
                        particleCtx.beginPath();
                        particleCtx.arc(0, 0, this.size, 0, Math.PI * 2);
                        particleCtx.fillStyle = `hsla(${20 + Math.random() * 20}, 100%, 60%, ${this.opacity})`;
                        particleCtx.shadowBlur = 25;
                        particleCtx.fill();
                    } else {
                        particleCtx.beginPath();
                        particleCtx.arc(0, 0, this.size * 0.8, 0, Math.PI * 2);
                        particleCtx.fillStyle = `rgba(60, 60, 60, ${this.opacity * 0.8})`;
                        particleCtx.fill();
                    }
                }
            }

            getColor() {
                if (this.type === 'fire') return `hsla(30, 100%, 50%, ${this.opacity})`;
                if (this.type === 'water') return `rgba(100, 180, 255, ${this.opacity})`;
                if (this.type === 'metal') return `rgba(200, 200, 200, ${this.opacity})`;
                return `rgba(255, 255, 255, ${this.opacity})`;
            }
        }

        function createParticles(text, type) {
            particles = [];
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;

            // Screen-immersive particles
            const totalParticles = Math.floor((window.innerWidth * window.innerHeight) / 3000);

            // Text character particles
            const textChars = text.split('').filter(c => c.trim());
            textChars.forEach((c, i) => {
                const angle = (i / textChars.length) * Math.PI * 2;
                const baseX = cx + Math.cos(angle) * 150;
                const baseY = cy + Math.sin(angle) * 150;

                for (let j = 0; j < 3; j++) {
                    const offsetX = (Math.random() - 0.5) * 30;
                    const offsetY = (Math.random() - 0.5) * 30;
                    particles.push(new Particle(c, baseX + offsetX, baseY + offsetY, type));
                }
            });

            // Ambient particles
            const ambientCount = totalParticles - textChars.length * 3;
            for (let i = 0; i < ambientCount; i++) {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                particles.push(new Particle('', x, y, type));
            }
        }

        function animateParticles() {
            particleCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            particles = particles.filter(p => {
                p.update();
                p.draw();
                return p.life > 0;
            });

            if (particles.length > 0) {
                requestAnimationFrame(animateParticles);
            }
        }

        function connectWithElement(element) {
            const generatedText = document.getElementById('prayerText').querySelector('p').textContent;
            const additionalInput = document.getElementById('additionalPrayer').value.trim();
            const combinedText = additionalInput ? generatedText + ' ' + additionalInput : generatedText;

            // Hide UI
            document.getElementById('prayerText').classList.remove('visible');
            document.getElementById('additionalInput').classList.remove('visible');
            document.getElementById('elementSelector').classList.remove('visible');

            // Show pray again button
            setTimeout(() => {
                document.getElementById('prayAgainButton').classList.add('visible');
            }, 500);

            // Launch comet
            launchComet();

            // Map element to effect type
            let effectType;
            if (currentPrayerMode === 'pray') {
                const prayMap = { metal: 'metal', wood: 'wood', water: 'water', fire: 'fire', earth: 'earth' };
                effectType = prayMap[element];
            } else {
                const reliefMap = { metal: 'shatter', wood: 'wood-break', water: 'flood', fire: 'burn', earth: 'earth-crack' };
                effectType = reliefMap[element];
            }

            // Create particles
            createParticles(combinedText, effectType);
            animateParticles();
        }

        function restartPrayer() {
            // Hide pray again button
            document.getElementById('prayAgainButton').classList.remove('visible');

            // Clear inputs
            document.getElementById('additionalPrayer').value = '';
            document.getElementById('prayerText').querySelector('p').textContent = '';

            // Show prayer bar
            setTimeout(() => {
                document.getElementById('prayerBar').classList.remove('hidden');
            }, 300);

            // Clear particles
            particles = [];
        }

        // ============================================
        // AUDIO
        // ============================================
        let audioPlaying = false;

        function initAudio() {
            const audio = document.getElementById('backgroundAudio');

            // Try to autoplay
            audio.play().then(() => {
                audioPlaying = true;
                updateMusicButton();
            }).catch(() => {
                // If autoplay fails, play on first user interaction
                document.addEventListener('pointerdown', () => {
                    audio.play().then(() => {
                        audioPlaying = true;
                        updateMusicButton();
                    });
                }, { once: true });
            });
        }

        function toggleMusic() {
            const audio = document.getElementById('backgroundAudio');
            if (audioPlaying) {
                audio.pause();
                audioPlaying = false;
            } else {
                audio.play();
                audioPlaying = true;
            }
            updateMusicButton();
        }

        function updateMusicButton() {
            const button = document.getElementById('musicControl');
            button.textContent = audioPlaying ? '🔊' : '🔇';
        }

        // ============================================
        function initElementSelector() {
            const emojis = document.querySelectorAll('.element-emoji');
            emojis.forEach(emoji => {
                emoji.addEventListener('click', function() {
                    const element = this.getAttribute('data-element');
                    connectWithElement(element);
                });
            });
        }

        // ============================================
        // NAVIGATION
        // ============================================
        function goBackHome() {
            // Stop music before leaving
            const audio = document.getElementById('backgroundAudio');
            audio.pause();
            audio.currentTime = 0;
            audioPlaying = false;

            // Check if we're in an iframe
            if (window.parent !== window) {
                // We're in an iframe, tell parent to show home page
                window.parent.postMessage({action: 'showHome'}, '*');
            } else {
                // Direct navigation
                window.location.href = 'index.html';
            }
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            initThreeJS();
            initParticleCanvas();
            initAudio();
            initElementSelector();
        });

        // Stop music when page is hidden/unloaded
        window.addEventListener('pagehide', () => {
            const audio = document.getElementById('backgroundAudio');
            audio.pause();
            audio.currentTime = 0;
        });

        window.addEventListener('beforeunload', () => {
            const audio = document.getElementById('backgroundAudio');
            audio.pause();
            audio.currentTime = 0;
        });
    </script>
</body>
</html>
